services:
  - type: web
    name: savomart-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: savomart-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://savomart-sde-intern-task-2026.vercel.app
      - key: SECRET_KEY
        value: "REPLACE_WITH_SECRET"
      - key: GROQ_API_KEY
        value: ""
      - key: OTP_DEV_MODE
        value: "false"
      - key: SAVOMART_API_URL
        value: ""
      - key: SAVOMART_API_TOKEN
        value: ""
      - key: SUPPORT_PHONE
        value: "+91 98765 00000"
      - key: SUPPORT_EMAIL
        value: "support@savomart.in"

databases:
  - name: savomart-db
    engine: postgres
    plan: free
